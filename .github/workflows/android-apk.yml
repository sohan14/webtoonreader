name: Android CI Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Print toolchain info
        run: |
          java -version
          gradle -v
          sdkmanager --version

      - name: Install Android SDK packages (with retry)
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local n=0
            local max=3
            local delay=10
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Retry $n/$max for: $*"
              sleep "$delay"
            done
          }

          yes | sdkmanager --licenses >/dev/null || true
          retry sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list | sed -n '1,160p'

      - name: Run debug build with automatic fallback variants
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          run_variant() {
            local name="$1"
            shift
            echo "=== Running variant: ${name} ===" | tee "ci-logs/${name}.meta"
            set +e
            gradle :app:assembleDebug --stacktrace --info --no-daemon --warning-mode all "$@" 2>&1 | tee "ci-logs/${name}.log"
            local ec=${PIPESTATUS[0]}
            set -e
            return "$ec"
          }

          if run_variant default; then
            echo "default" > ci-logs/success-variant.txt
            exit 0
          fi

          if run_variant agp842 -PagpVersion=8.4.2 -PkotlinVersion=1.9.24 -PcomposeCompilerVersion=1.5.14; then
            echo "agp842" > ci-logs/success-variant.txt
            exit 0
          fi

          if run_variant agp822 -PagpVersion=8.2.2 -PkotlinVersion=1.9.22 -PcomposeCompilerVersion=1.5.10; then
            echo "agp822" > ci-logs/success-variant.txt
            exit 0
          fi

          echo "none" > ci-logs/success-variant.txt
          exit 1

      - name: Extract failure reason (always)
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "### Build quick summary"
            echo ""
            if [ -f ci-logs/success-variant.txt ]; then
              echo "Succeeded variant: $(cat ci-logs/success-variant.txt)"
              echo ""
            fi
            echo "Top error lines:"
            grep -h -E "^\* What went wrong:|^FAILURE: Build failed|^Caused by:|Received status code|Execution failed for task|Could not resolve" ci-logs/*.log | head -n 60 || true
          } > ci-logs/failure-signature.txt
          cat ci-logs/failure-signature.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ci-logs/*.log
            ci-logs/*.meta
            ci-logs/success-variant.txt
            ci-logs/failure-signature.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build failure summary
        if: failure()
        run: |
          echo "❌ Build failed. See build-logs artifact (all variant logs + summary)." >> "$GITHUB_STEP_SUMMARY"

      - name: Build success summary
        if: success()
        run: |
          echo "✅ Build succeeded. APK artifact: webtoon-reader-debug-apk" >> "$GITHUB_STEP_SUMMARY"
