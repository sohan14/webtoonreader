name: Android CI Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Print toolchain info
        run: |
          java -version
          gradle -v
          sdkmanager --version

      - name: Install Android SDK packages (with retry)
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local n=0
            local max=3
            local delay=10
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Retry $n/$max for: $*"
              sleep "$delay"
            done
          }

          yes | sdkmanager --licenses >/dev/null || true
          retry sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list | sed -n '1,160p'

      - name: Run debug build (capture logs, with retry)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          retry() {
            local n=0
            local max=2
            local delay=10
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Retry $n/$max for: $*"
              sleep "$delay"
            done
          }

          retry gradle :app:assembleDebug --stacktrace --info --no-daemon --warning-mode all 2>&1 | tee ci-logs/assembleDebug.log

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs/assembleDebug.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build failure summary
        if: failure()
        run: |
          echo "❌ Build failed. Download build-logs/assembleDebug.log for the exact stacktrace." >> "$GITHUB_STEP_SUMMARY"

      - name: Build success summary
        if: success()
        run: |
          echo "✅ Build succeeded. APK artifact: webtoon-reader-debug-apk" >> "$GITHUB_STEP_SUMMARY"
